apiVersion: v1
kind: Pod

metadata:
  name: secret-env-demo

spec:
  containers:
  - name: nginx
    image: nginx

    env:
    - name: DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_USERNAME

    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWORD
