apiVersion: v1
kind: Pod

metadata:
  name: configmap-env-demo

spec:
  containers:
  - name: demo
    image: nginx

    env:
    - name: APP_NAME
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: APP_NAME

    - name: ENVIRONMENT
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: ENVIRONMENT

    - name: PORT
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: PORT
